version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nexuserp_postgres
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
      POSTGRES_DB: nexuserp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: nithish1875/nexuserp-backend:latest
    build: ./server
    container_name: nexuserp_backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://postgres.ijnnazbvnufevfyappts:P5Vqn0ALIGxUcJsG@aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres"
      JWT_SECRET: "mini_erp_super_secret_jwt_key_2026"
    depends_on:
      - postgres

  frontend:
    image: nithish1875/nexuserp-frontend:latest
    build: ./client
    container_name: nexuserp_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
