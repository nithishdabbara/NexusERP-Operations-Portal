version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mini_erp_postgres
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
      POSTGRES_DB: mini_erp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./server
    container_name: mini_erp_backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: "file:./dev.db"
      JWT_SECRET: "mini_erp_super_secret_jwt_key_2026"
    depends_on:
      - postgres

  frontend:
    build: ./client
    container_name: mini_erp_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
